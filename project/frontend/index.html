function IssueBookModal({ preselectedBook, currentUser, onClose, onSuccess, showNotification }) {
    const [books, setBooks] = useState([]);
    const [borrowers, setBorrowers] = useState([]);
    const [selectedBookId, setSelectedBookId] = useState(preselectedBook ? preselectedBook.book_id : "");
    const [selectedBorrowerId, setSelectedBorrowerId] = useState(currentUser?.borrower_id ? currentUser.borrower_id : "");
    const [loanDays, setLoanDays] = useState(currentUser ? (currentUser.allowed_loan_days || 14) : 14);
    const [issueDate, setIssueDate] = useState(new Date().toISOString().slice(0, 10));
    const [submitting, setSubmitting] = useState(false);

    useEffect(() => {
        apiRequest("/api/books").then(data => setBooks(data));
        apiRequest("/api/borrowers").then(data => {
            setBorrowers(data);
            if (!currentUser && data.length > 0) {
                const b = data[0];
                setSelectedBorrowerId(b.borrower_id);
                setLoanDays(b.borrower_type === "Student" ? 7 : b.borrower_type === "Teacher" ? 14 : 30);
            }
        });
    }, []);

    const selectedBookObj = books.find(b => b.book_id === Number(selectedBookId));
    const selectedBorrowerObj = borrowers.find(b => b.borrower_id === Number(selectedBorrowerId));

    // When borrower changes, update default loan days based on their persona
    const handleBorrowerChange = (e) => {
        const bId = Number(e.target.value);
        setSelectedBorrowerId(bId);
        const bObj = borrowers.find(b => b.borrower_id === bId);
        if (bObj) {
            const days = bObj.borrower_type === "Student" ? 7 : bObj.borrower_type === "Teacher" ? 14 : 30;
            setLoanDays(days);
        }
    };

    const handleSubmit = async (e) => {
        e.preventDefault();
        if (!selectedBookId || !selectedBorrowerId) {
            showNotification("Please select both a book and a borrower.", "error");
            return;
        }

        if (selectedBookObj && selectedBookObj.copies_available <= 0) {
            showNotification("Cannot issue: Selected book has 0 copies available.", "error");
            return;
        }

        setSubmitting(true);
        try {
            await apiRequest("/api/loans/issue", {
                method: "POST",
                body: JSON.stringify({
                    book_id: Number(selectedBookId),
                    borrower_id: Number(selectedBorrowerId),
                    issue_date: issueDate,
                    loan_period_days: Number(loanDays)
                })
            });
            onSuccess();
        } catch (err) {
            showNotification(err.message, "error");
            setSubmitting(false);
        }
    };

    return (
        <div className="modal-overlay">
            <div className="modal-content">
                <div className="modal-header">
                    <h3>Issue Book to Patron</h3>
                    <button className="modal-close" onClick={onClose}>&times;</button>
                </div>
                <form onSubmit={handleSubmit}>
                    <div className="modal-body">
                        <div className="form-group">
                            <label>Select Book *</label>
                            <select 
                                value={selectedBookId} 
                                onChange={(e) => setSelectedBookId(e.target.value)}
                                required
                            >
                                <option value="">-- Choose a Book --</option>
                                {books.map(b => (
                                    <option key={b.book_id} value={b.book_id} disabled={b.copies_available <= 0}>
                                        {b.title} (Available: {b.copies_available}/{b.total_copies}) {b.copies_available <= 0 ? "- [OUT OF STOCK]" : ""}
                                    </option>
                                ))}
                            </select>
                            {selectedBookObj && (
                                <div className="help-text">
                                    Author: {selectedBookObj.author} | Category: {selectedBookObj.category}
                                </div>
                            )}
                        </div>

                        <div className="form-group">
                            <label>Select Borrower *</label>
                            <select 
                                value={selectedBorrowerId} 
                                onChange={handleBorrowerChange}
                                required
                            >
                                <option value="">-- Choose a Registered Patron --</option>
                                {borrowers.map(b => (
                                    <option key={b.borrower_id} value={b.borrower_id}>
                                        {b.borrower_name} ({b.borrower_type || "Student"} &bull; {b.roll_no})
                                    </option>
                                ))}
                            </select>
                            {selectedBorrowerObj && (
                                <div className="help-text" style={{color: "var(--primary)", fontWeight: 600}}>
                                    Persona: {selectedBorrowerObj.borrower_type} &bull; Policy Due Period: {selectedBorrowerObj.borrower_type === "Student" ? 7 : selectedBorrowerObj.borrower_type === "Teacher" ? 14 : 30} Days
                                </div>
                            )}
                        </div>

                        <div style={{display: "grid", gridTemplateColumns: "1fr 1fr", gap: "12px"}}>
                            <div className="form-group">
                                <label>Issue Date</label>
                                <input 
                                    type="date" 
                                    value={issueDate} 
                                    onChange={(e) => setIssueDate(e.target.value)}
                                    required 
                                />
                            </div>
                            <div className="form-group">
                                <label>Loan Period (Days)</label>
                                <input 
                                    type="number" 
                                    min="1" 
                                    max="180" 
                                    value={loanDays} 
                                    onChange={(e) => setLoanDays(e.target.value)}
                                    required 
                                />
                                <div className="help-text">Auto-calculated based on Persona Tier.</div>
                            </div>
                        </div>
                    </div>
                    <div className="modal-footer">
                        <button type="button" className="btn btn-outline" onClick={onClose}>Cancel</button>
                        <button type="submit" className="btn btn-primary" disabled={submitting}>
                            {submitting ? "Processing..." : "Confirm & Issue Book"}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    );
}

function BookFormModal({ title, initialData, onClose, onSubmit }) {
    const [formData, setFormData] = useState({
        isbn: initialData ? initialData.isbn : "",
        title: initialData ? initialData.title : "",
        author: initialData ? initialData.author : "",
        category: initialData ? initialData.category : "Computer Science",
        total_copies: initialData ? initialData.total_copies : 3,
        copies_available: initialData ? initialData.copies_available : 3
    });

    const handleSubmit = (e) => {
        e.preventDefault();
        onSubmit(formData);
    };

    return (
        <div className="modal-overlay">
            <div className="modal-content">
                <div className="modal-header">
                    <h3>{title}</h3>
                    <button className="modal-close" onClick={onClose}>&times;</button>

                            />
                        </div>
                        <div className="form-group">
                            <label>Book Title *</label>
                            <input 
                                type="text" 
                                value={formData.title} 
                                onChange={(e) => setFormData({...formData, title: e.target.value})}
                                placeholder="Enter book title"
                                required
                            />
                        </div>
                        <div className="form-group">
                            <label>Author(s) *</label>
                            <input 
                                type="text" 
                                value={formData.author} 
                                onChange={(e) => setFormData({...formData, author: e.target.value})}
                                placeholder="e.g. Brian W. Kernighan"
                                required
                            />
                        </div>
                        <div className="form-group">
                            <label>Category *</label>
                            <input 
                                type="text" 
                                value={formData.category} 
                                onChange={(e) => setFormData({...formData, category: e.target.value})}
                                placeholder="e.g. Computer Science, Mathematics, Physics"
                                required
                            />

                                <label>Total Physical Copies</label>
                                <input 
                                    type="number" 
                                    min="1" 
                                    value={formData.total_copies} 
                                    onChange={(e) => {
                                        const tot = parseInt(e.target.value) || 1;
                                        setFormData({
                                            ...formData, 
                                            total_copies: tot,

                                        });
                                    }}

                                />

                            <div className="form-group">
                                <label>Available Copies</label>
                                <input 
                                    type="number" 
                                    min="0" 
                                    max={formData.total_copies}

                                    onChange={(e) => setFormData({...formData, copies_available: parseInt(e.target.value) || 0})}
                                    required
                                />
                            </div>
                        </div>
                    </div>
                    <div className="modal-footer">
                        <button type="button" className="btn btn-outline" onClick={onClose}>Cancel</button>
                        <button type="submit" className="btn btn-primary">Save Book</button>
                    </div>
                </form>
            </div>
        </div>
    );
}

function BorrowerFormModal({ onClose, onSubmit, existingBorrowers = [], showNotification }) {
    const [formData, setFormData] = useState({
        borrower_name: "",
        roll_no: "",
        borrower_type: "Student",
        email: "",
        contact: "",
        password: "123456"
    });
    const [idConflictError, setIdConflictError] = useState("");

    const handleRollChange = (val) => {
        setFormData({ ...formData, roll_no: val });
        const clean = val.trim().toLowerCase();
        const conflict = existingBorrowers.find(b => (b.roll_no || "").toLowerCase() === clean);
        if (conflict) {
            setIdConflictError(`ID Number '${val}' is already registered to ${conflict.borrower_name}! One ID can only belong to one person.`);
        } else {
            setIdConflictError("");
        }
    };

    const handleSubmit = (e) => {
        e.preventDefault();
        const clean = formData.roll_no.trim().toLowerCase();
        const conflict = existingBorrowers.find(b => (b.roll_no || "").toLowerCase() === clean);
        if (conflict) {
            if (showNotification) showNotification(`Cannot add: ID '${formData.roll_no}' already exists in system!`, "error");
            return;
        }
        onSubmit(formData);
    };

    return (
        <div className="modal-overlay">
            <div className="modal-content">
                <div className="modal-header">
                    <h3>Register New Borrower</h3>
                    <button className="modal-close" onClick={onClose}>&times;</button>
                </div>
                <form onSubmit={handleSubmit}>
                    <div className="modal-body">
                        <div className="form-group">
                            <label>ID Number / Roll Number * <span style={{fontSize: "0.72rem", color: "var(--text-muted)"}}>(Must be unique)</span></label>
                            <input 
                                type="text" 
                                value={formData.roll_no} 
                                onChange={(e) => handleRollChange(e.target.value)}
                                placeholder="e.g. STU104 or FAC501"
                                style={{fontFamily: "monospace", fontWeight: 600, borderColor: idConflictError ? "var(--danger)" : undefined}}
                                required
                            />
                            {idConflictError && (
                                <div style={{color: "var(--danger)", fontSize: "0.78rem", marginTop: "4px", fontWeight: 600}}>
                                    <i className="fa-solid fa-triangle-exclamation"></i> {idConflictError}
                                </div>
                            )}
                        </div>
                        <div className="form-group">
                            <label>Full Name *</label>
                            <input 
                                type="text" 
                                value={formData.borrower_name} 
                                onChange={(e) => setFormData({...formData, borrower_name: e.target.value})}
                                placeholder="e.g. Aarav Sharma"
                                required
                            />
                        </div>
                        <div className="form-group">
                            <label>Password *</label>
                            <input 
                                type="password" 
                                value={formData.password} 
                                onChange={(e) => setFormData({...formData, password: e.target.value})}
                                placeholder="Default: 123456"
                                required
                            />
                        </div>
                        <div className="form-group">
                            <label>Persona Tier (Due Date Policy) *</label>
                            <select 
                                value={formData.borrower_type} 
                                onChange={(e) => setFormData({...formData, borrower_type: e.target.value})}
                                required
                            >
                                <option value="Student">🎓 Student (7 Days Due Limit - Less Due Time)</option>
                                <option value="Teacher">👨‍🏫 Teacher (14 Days Due Limit - More Than Student)</option>
                                <option value="Business Man">💼 Business Man (30 Days Due Limit - Maximum Due Time)</option>
                                <option value="Admin">🛡️ Admin (System Administrator - Master Control)</option>
                            </select>
                        </div>
                        <div className="form-group">
                            <label>Email Address</label>
                            <input 
                                type="email" 
                                value={formData.email} 
                                onChange={(e) => setFormData({...formData, email: e.target.value})}
                                placeholder="patron@college.edu"
                            />
                        </div>
                        <div className="form-group">
                            <label>Contact Number</label>
                            <input 
                                type="text" 
                                value={formData.contact} 
                                onChange={(e) => setFormData({...formData, contact: e.target.value})}
                                placeholder="e.g. 9876543210"
                            />
                        </div>
                    </div>
                    <div className="modal-footer">
                        <button type="button" className="btn btn-outline" onClick={onClose}>Cancel</button>
                        <button type="submit" className="btn btn-primary" disabled={!!idConflictError}>Register Borrower</button>
                    </div>
                </form>
            </div>
        </div>
    );
}

function SettingsModal({ onClose, showNotification, triggerRefresh }) {
    const [settings, setSettings] = useState({
        student_loan_days: 7,
        teacher_loan_days: 14,
        business_man_loan_days: 30,
        default_loan_days: 14,
        daily_overdue_fine: 1.50,
        active_engine: "mysql",
        db_name: "library_db"
    });

    useEffect(() => {
        apiRequest("/api/settings").then(data => setSettings(data));
    }, []);

    const handleSave = async (e) => {
        e.preventDefault();
        try {
            await apiRequest("/api/settings", {
                method: "PUT",
                body: JSON.stringify({
                    default_loan_days: Number(settings.default_loan_days),
                    daily_overdue_fine: Number(settings.daily_overdue_fine)
                })
            });
            showNotification("System settings updated successfully!");
            triggerRefresh();
            onClose();
        } catch (err) {
            showNotification(err.message, "error");
        }
    };

    const handleReseed = async () => {
        if (!confirm("Are you sure? This will reset all books, borrowers, and loans to the fresh initial demo dataset.")) return;
        try {
            await apiRequest("/api/database/reseed", { method: "POST" });
            showNotification("Database successfully reset and reseeded!");
            triggerRefresh();
            onClose();
        } catch (err) {
            showNotification(err.message, "error");
        }
    };

    return (
        <div className="modal-overlay">
            <div className="modal-content">
                <div className="modal-header">
                    <h3>System Settings &amp; Due Date Rules</h3>
                    <button className="modal-close" onClick={onClose}>&times;</button>
                </div>
                <form onSubmit={handleSave}>
                    <div className="modal-body">
                        <div style={{background: "#f8fafc", padding: "12px 16px", borderRadius: "8px", marginBottom: "16px", border: "1px solid #e2e8f0"}}>
                            <div style={{fontSize: "0.85rem", color: "var(--text-secondary)"}}>
                                <strong>Active Database Engine:</strong> <span className={`engine-badge ${settings.active_engine}`}>{settings.active_engine.toUpperCase()}</span>
                            </div>
                            <div style={{fontSize: "0.8rem", color: "var(--text-muted)", marginTop: "4px"}}>
                                Target Database: <code>{settings.db_name}</code>
                            </div>
                        </div>

                        <div style={{background: "#f1f5f9", padding: "14px", borderRadius: "8px", marginBottom: "16px"}}>
                            <strong style={{fontSize: "0.86rem", display: "block", marginBottom: "8px"}}>Persona Due Limits (Configured):</strong>
                            <div style={{display: "flex", flexDirection: "column", gap: "6px", fontSize: "0.82rem"}}>
                                <div>🎓 <strong>Student:</strong> 7 Days Due Limit (Less due time)</div>
                                <div>👨‍🏫 <strong>Teacher:</strong> 14 Days Due Limit (More than student)</div>
                                <div>💼 <strong>Business Man:</strong> 30 Days Due Limit (Maximum due time)</div>
                            </div>
                        </div>

                        <div className="form-group">
                            <label>Daily Overdue Fine ($ / currency unit)</label>
                            <input 
                                type="number" 
                                step="0.25"
                                min="0" 
                                value={settings.daily_overdue_fine}
                                onChange={(e) => setSettings({...settings, daily_overdue_fine: e.target.value})}
                                required
                            />
                            <div className="help-text">Rate charged per day overdue past the due date.</div>
                        </div>

                        <hr style={{border: "none", borderTop: "1px solid #e2e8f0", margin: "20px 0"}} />

                        <div style={{display: "flex", justifyContent: "space-between", alignItems: "center"}}>
                            <div>
                                <strong style={{fontSize: "0.88rem"}}>Reset &amp; Reseed Demo Data</strong>
                                <div style={{fontSize: "0.78rem", color: "var(--text-muted)"}}>Restores sample records with Student, Teacher, and Business Man loans.</div>
                            </div>
                            <button type="button" className="btn btn-outline btn-sm" onClick={handleReseed} style={{color: "var(--warning)", borderColor: "#fde68a"}}>
                                <i className="fa-solid fa-arrows-rotate"></i> Reset Data
                            </button>
                        </div>
                    </div>
                    <div className="modal-footer">
                        <button type="button" className="btn btn-outline" onClick={onClose}>Cancel</button>
                        <button type="submit" className="btn btn-primary">Save Settings</button>
                    </div>
                </form>
            </div>
        </div>
    );
}

// Render root React component
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
    </script>
</body>
</html>
